<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10251f"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>CW Trainer</title><style>
*{box-sizing:border-box}body{margin:0;background:#10251f;color:#e9f4ee;font:16px system-ui,sans-serif}main{max-width:640px;margin:auto;padding:20px 14px 40px}h1{font-size:25px;margin:0 0 18px}button,select,input{font:inherit}button,select{color:inherit;background:#203d32;border:1px solid #466257;border-radius:9px;padding:12px;touch-action:manipulation}button:disabled{opacity:.4}button.primary{background:#a6edbc;color:#10251f;font-weight:bold}header,.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric,.panel{background:#19332a;border:1px solid #375348;border-radius:14px;padding:13px}small{color:#a9c3b5;font-size:11px}.metric strong{display:block;font-size:23px;margin-top:5px}.panel{text-align:center;margin:15px 0}.copy{font: bold 30px monospace;min-height:48px;overflow-wrap:anywhere;letter-spacing:2px}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:14px 0}.keys button{padding:12px 0;font:bold 20px monospace;min-height:48px}.actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}#feedback{min-height:48px;color:#c2e2cd}progress{width:100%;accent-color:#a6edbc}label{display:flex;gap:8px;align-items:center;margin:12px 0}input[type=range]{width:110px;accent-color:#a6edbc}details{margin-top:18px}a{color:#a6edbc}.good{color:#a6edbc}.bad{color:#ffae9e}#master{display:flex;flex-wrap:wrap;gap:8px}#master span{width:32px;text-align:center;font:14px monospace}#master progress{height:6px}#status{min-height:24px}#settings{font-size:14px}body.playing #status{color:#a6edbc}
</style></head><body><main><header><h1>CW Trainer</h1><button id="reset">Reset</button></header><div class="metrics"><div class="metric"><small>LEVEL</small><strong id="level"></strong></div><div class="metric"><small>WPM</small><strong id="speed"></strong></div><div class="metric"><small>ACCURACY</small><strong id="accuracy"></strong></div><div class="metric"><small>GROUP</small><strong id="group"></strong></div></div><p><small id="goal"></small><progress id="progress" max="1"></progress></p><section class="panel"><div id="status" aria-live="polite">Ready</div><p id="copy" class="copy">—</p><p id="feedback" aria-live="polite">Listen and type what you hear.</p><div class="actions"><button class="primary" id="start">Start</button><button id="replay">Replay</button><button id="check">Check</button><button id="skip">Skip</button></div><div id="keys" class="keys"></div><small>Keyboard: Enter to check · Esc to replay</small></section><h3>Character mastery</h3><div id="master"></div><h3>Copy skills</h3><div id="skills"></div><details id="settings"><summary>Settings & progress</summary><label>Pitch <input id="pitch" type="range" min="400" max="900" value="600"> Hz</label><label>Volume <input id="volume" type="range" min="0" max="100" value="35"></label><label><input id="auto" type="checkbox" checked> Auto advance</label><label>Mode <select id="mode"><option value="adaptive">Adaptive</option><option value="single">Characters</option><option value="random">Random groups</option><option value="word">Words</option><option value="ham">Ham shorthand</option><option value="qso">QSO fragments</option></select></label><button id="export">Export progress</button> <button id="import">Import progress</button><input type="file" id="file" accept="application/json" hidden><p>Progress stays on this device. No account or tracking. Install via your browser's Add to Home Screen menu.</p></details></main><script type="module" src="./app.js"></script></body></html>
