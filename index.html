<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10251f"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>CW Trainer</title><style>
:root{color-scheme:dark;--bg:#090f18;--surface:#111c29;--line:#273a4b;--ink:#eaf3ff;--muted:#8299ad;--accent:#70e8ce;--amber:#ffce82}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#1a3241 0,transparent 55%),var(--bg);color:var(--ink);font:15px system-ui,sans-serif;-webkit-tap-highlight-color:transparent}main{max-width:650px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 10px max(30px,env(safe-area-inset-bottom))}header,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}header{padding:4px 8px 18px}h1{font-size:24px;letter-spacing:-.05em;margin:0}h1:before{content:"CW";display:inline-grid;place-items:center;background:var(--accent);color:var(--bg);font:800 13px monospace;width:36px;height:36px;border-radius:11px;margin-right:10px;vertical-align:middle}button,select,input{font:inherit}button,select{color:inherit;background:#1c2d3e;border:1px solid #35495b;border-radius:10px;padding:10px;touch-action:manipulation}button:active:not(:disabled){transform:translateY(2px)}button:disabled{opacity:.35}button.primary{background:var(--accent);color:#09221e;font-weight:750;border-color:transparent}#reset{font-size:12px;background:transparent;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.metric,.panel{background:linear-gradient(155deg,#152331,#101925);border:1px solid var(--line);border-radius:16px}.metric{padding:10px 8px}.metric small{font:600 9px monospace;letter-spacing:.08em}.metric strong{display:block;font:650 clamp(19px,5vw,28px) system-ui;margin-top:3px;font-variant-numeric:tabular-nums}small{color:var(--muted)}progress{width:100%;height:7px;accent-color:var(--accent);border:0;border-radius:8px;overflow:hidden}progress::-webkit-progress-bar{background:#203241}progress::-webkit-progress-value{background:var(--accent)}.panel{text-align:center;margin:12px 0;padding:14px 6px 10px;box-shadow:0 16px 50px #0003}.receiver{position:relative;isolation:isolate;display:grid;place-items:center;height:clamp(105px,23vw,165px);overflow:hidden}.receiver:before{content:"";position:absolute;inset:0;background:linear-gradient(#7898ad0b 1px,transparent 1px),linear-gradient(90deg,#7898ad0b 1px,transparent 1px);background-size:20px 20px;mask-image:radial-gradient(ellipse,#000,transparent 75%);z-index:-1}#signal{width:min(76%,260px);height:100%;overflow:visible}.ring{fill:none;stroke:#70e8ce;stroke-width:1;opacity:.15;transform-origin:120px 65px}.core{fill:#70e8ce;opacity:.23;transition:opacity .035s}.trace{stroke:#70e8ce;stroke-width:2;fill:none;opacity:.65;stroke-linecap:round}body.keyed .core{opacity:1;filter:drop-shadow(0 0 12px #70e8ce)}body.keyed .ring{animation:ripple .7s ease-out infinite;opacity:.7}body.keyed .ring:nth-child(2){animation-delay:-.35s}@keyframes ripple{from{transform:scale(.7);opacity:.85}to{transform:scale(1.45);opacity:0}}#status{font:600 11px monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-height:18px}body.playing #status{color:var(--accent)}.copy{font:650 clamp(25px,7vw,36px) monospace;min-height:42px;overflow-wrap:anywhere;letter-spacing:3px;margin:8px 0}#feedback{min-height:34px;color:#b7c9d9;margin:4px 0 10px;font-size:13px}.actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.actions button{min-height:42px;font-size:13px}.keys{display:flex;flex-direction:column;gap:7px;margin:18px 0 10px}.keyrow{display:flex;justify-content:center;gap:4px}.keyrow button{flex:0 1 calc((100% - 36px)/10);min-width:0;min-height:clamp(43px,11vw,57px);padding:0;font:650 clamp(14px,4vw,21px) monospace;border-radius:8px;transition:background .18s,box-shadow .18s,opacity .18s;box-shadow:0 3px 0 #071019}.keyrow .locked{background:#0d1721;border-color:#1b2936;color:#506477;opacity:.48;box-shadow:none}.keyrow .unlocked{background:#254b4b;border-color:#4cae9d;color:#d8fff5;box-shadow:0 3px 0 #13302f,0 0 10px #70e8ce12}.keyrow .unlocked:disabled{opacity:.8}.keyrow .new{animation:unlock .65s ease-out}@keyframes unlock{0%{transform:scale(.7);background:#70e8ce;color:#10251f}55%{transform:scale(1.13)}100%{transform:scale(1)}}.keyrow .utility{flex:0 1 23%;font:600 13px system-ui}.keyrow .space{flex:0 1 48%}h3{font-size:13px;color:#b8cbdc;margin:20px 4px 10px}#master{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}#master span{width:32px;text-align:center;font:14px monospace}#master progress{height:5px}#skills{color:var(--muted);font-size:13px;padding:0 4px}details{margin:18px 4px;color:var(--muted);font-size:13px}label{display:flex;gap:8px;align-items:center;margin:12px 0}input[type=range]{width:110px;accent-color:var(--accent)}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:350px){main{padding-left:5px;padding-right:5px}.keyrow{gap:3px}.keyrow button{flex-basis:calc((100% - 27px)/10)}}

[hidden]{display:none!important}main{position:relative;min-height:100dvh;display:flex;flex-direction:column}header{flex:none;position:relative;z-index:5;padding:4px 4px 10px}.hud{display:flex;align-items:center;gap:6px}.hud button{min-height:38px;padding:0 11px;background:#122331;color:var(--muted);font:600 12px system-ui}.hud button span{font-size:16px;vertical-align:-1px}.hud button[aria-expanded=true]{border-color:var(--accent);color:var(--accent);background:#1d393b}.hudpanel{position:absolute;z-index:4;top:max(65px,calc(env(safe-area-inset-top) + 54px));left:10px;right:10px;padding:16px;background:#111f2df5;border:1px solid #3a5265;border-radius:15px;box-shadow:0 20px 65px #000a;backdrop-filter:blur(20px);max-height:75dvh;overflow:auto;overscroll-behavior:contain}.hudpanel h3:first-child{margin-top:0}.hudpanel>p{font-size:12px;color:var(--muted)}.settingspanel button{margin:5px 0}.panel{flex:1;display:flex;flex-direction:column;justify-content:flex-start;border:0;background:none;box-shadow:none;margin:0;padding:12px 0 4px;min-height:0}.receiver{flex:1;min-height:clamp(135px,25vh,270px);height:auto;max-height:360px}.receiver svg{width:min(85%,340px);height:100%;min-height:135px}.keys{margin:22px 0 12px;gap:8px}.keyrow button{min-height:clamp(43px,11vw,60px)}.actions{margin-top:5px}#status{margin:10px 0 0}.copy{margin:12px 0}#feedback{min-height:38px}.panel>small{font-size:11px}@media(max-height:650px){.receiver{min-height:90px;max-height:140px}.receiver svg{min-height:90px}.keys{margin-top:10px;gap:5px}.keyrow button{min-height:40px}.panel{padding-top:0}.copy{margin:4px 0}#feedback{min-height:25px}}@media(pointer:coarse){.panel>small{display:none}}

/* Every part of the receiver shares the same keyed brightness. */
#signal{color:#78e5cf;opacity:.24;transition:none}
#signal .core{fill:currentColor;fill-opacity:.19;stroke:currentColor;stroke-width:1.5;opacity:1;transition:none;filter:none}
#signal .trace{stroke:currentColor;opacity:1;transition:none}
#signal .ring{stroke:currentColor;animation:none;opacity:.7;transition:none}
body.keyed #signal{opacity:1}
body.keyed #signal .core{fill:currentColor;stroke:currentColor;opacity:1;filter:none}
body.keyed #signal .trace{stroke:currentColor;opacity:1}
body.keyed #signal .ring{animation:none;opacity:.7}

/* Keep the staggered letter rows anchored to a ten-key pitch. */
.keyrow:nth-child(4){transform:translateX(-5%)}
.keyburst{position:fixed;pointer-events:none;z-index:10;left:0;top:0;width:0;height:0}
.keyburst i{position:absolute;display:block;width:6px;height:6px;border-radius:50%;background:var(--particle);box-shadow:0 0 7px var(--particle);animation:keyparticle .48s cubic-bezier(.12,.65,.35,1) both}
@keyframes keyparticle{0%{transform:translate(-50%,-50%) scale(.7);opacity:1}35%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.15);opacity:0}}
.keyrow button.success-pop{animation:success-pop .25s ease-out}
@keyframes success-pop{0%{transform:scale(1)}35%{transform:scale(1.12);background:#70e8ce;color:#10251f;box-shadow:0 0 15px #70e8ce88}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.keyburst{display:none}}
</style></head><body><main><header><h1>Trainer</h1><nav class="hud" aria-label="Trainer panels"><button id="statsToggle" aria-expanded="false" aria-controls="statsPanel" title="Statistics"><span aria-hidden="true">▥</span> Stats</button><button id="settingsToggle" aria-expanded="false" aria-controls="settings" title="Settings"><span aria-hidden="true">⚙</span></button></nav></header><div id="statsPanel" class="hudpanel" hidden><div class="metrics"><div class="metric"><small>LEVEL</small><strong id="level"></strong></div><div class="metric"><small>WPM</small><strong id="speed"></strong></div><div class="metric"><small>ACCURACY</small><strong id="accuracy"></strong></div><div class="metric"><small>GROUP</small><strong id="group"></strong></div></div><p><small id="goal"></small><progress id="progress" max="1"></progress></p><h3>Character mastery</h3><div id="master"></div><h3>Copy skills</h3><div id="skills"></div></div><section class="panel"><div id="status" aria-live="polite">Ready</div><div class="receiver" aria-hidden="true"><svg id="signal" viewBox="0 0 240 130"><circle class="ring" cx="120" cy="65" r="37"/><circle class="ring" cx="120" cy="65" r="49"/><circle class="ring" cx="120" cy="65" r="59"/><circle class="core" cx="120" cy="65" r="24"/><path class="trace" d="M15 65 H77 M163 65 H225 M102 65 H110 L115 53 L123 77 L130 65 H138"/></svg></div><p id="copy" class="copy">—</p><p id="feedback" aria-live="polite">Listen and type what you hear.</p><div class="actions"><button class="primary" id="start">Start</button><button id="replay">Replay</button><button id="check">Check</button><button id="skip">Skip</button></div><div id="keys" class="keys"></div><small>Keyboard: Enter to check · Esc to replay</small></section><section id="settings" class="hudpanel settingspanel" hidden><h3>Settings & progress</h3><label>Pitch <input id="pitch" type="range" min="400" max="900" value="600"> Hz</label><label>Volume <input id="volume" type="range" min="0" max="100" value="35"></label><label><input id="effects" type="checkbox" checked> Feedback sounds</label><label><input id="auto" type="checkbox" checked> Auto advance</label><label>Mode <select id="mode"><option value="adaptive">Adaptive</option><option value="single">Characters</option><option value="random">Random groups</option><option value="word">Words</option><option value="ham">Ham shorthand</option><option value="qso">QSO fragments</option></select></label><button id="export">Export progress</button> <button id="import">Import progress</button><input type="file" id="file" accept="application/json" hidden><p>Progress stays on this device. No account or tracking. Install via your browser's Add to Home Screen menu.</p><button id="reset">Reset progress</button></section></main><script type="module" src="./app.js"></script></body></html>
